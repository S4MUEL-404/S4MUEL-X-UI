name: Update safety checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  update-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check Bash syntax
        run: bash -n install.sh
      - name: Test update and restore failure paths
        run: python3 test_updates.py
